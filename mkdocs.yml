site_name: My Zettelkasten
site_description: A personal knowledge base of podcast, lecture, and book notes
site_author: beyondgoodevil
site_url: https://beyondgoodevil.github.io/memorabilia/

repo_name: beyondgoodevil/memorabilia
repo_url: https://github.com/beyondgoodevil/memorabilia
edit_uri: edit/main/docs/

nav:
  - Introduction: index.md
  - Podcast/Video Notes:
      - Tech Podcasts:
          - podcast_video_notes/tech_podcasts/example_episode.md
      - YouTube Lectures:
          - podcast_video_notes/youtube_lectures/example_video.md
  - Lecture Notes:
      - Computer Science 101:
          - lecture_notes/computer_science_101/lecture_01_introduction.md
      - Example Course:
          - lecture_notes/example_course/example_lecture.md
  - Book Notes:
      - Example Book: book_notes/example_book.md
      - Iliad Chapters 13-20: book_notes/iliad_13-20.md

theme:
  name: material
  icon:
    logo: material/book-open-page-variant-outline
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      type: timeago
      enable_creation_date: true
      fallback_to_build_date: true
  - section-index
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "⚑"
      baselevel: 1
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/beyondgoodevil
